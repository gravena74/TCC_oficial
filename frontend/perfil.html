<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Perfil — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen screen--with-bottom-nav" id="screen" style="display: none;">
      <div class="top-bar">
        <a href="home.html" aria-label="Voltar" class="btn-round">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </a>
        <h1 style="font-size: 1.25rem; font-weight: 700;">Perfil</h1>
      </div>

      <div class="card pet-summary-card" style="margin-top: 1rem;">
        <div class="pet-summary-card__photo">
          <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
        </div>
        <div class="pet-summary-card__info">
          <p class="pet-summary-card__name" id="profileName">—</p>
          <p class="pet-summary-card__meta" id="profilePhone">—</p>
        </div>
        <button type="button" aria-label="Editar perfil" class="btn-round" id="editProfileBtn">
          <span class="material-symbols-rounded" aria-hidden="true">edit</span>
        </button>
      </div>

      <div class="field-stack" style="margin-top: 2rem;">
        <a href="pacotes.html" class="btn-outline">Meus pacotes</a>
        <button type="button" class="btn-outline" id="logoutBtn">Sair da conta</button>
      </div>

      <nav class="bottom-nav">
        <a href="home.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">home</span>
          <span>Início</span>
        </a>
        <a href="pets.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">calendar_add_on</span>
          <span>Agendar</span>
        </a>
        <a href="pets.html?mode=manage" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
          <span>Pets</span>
        </a>
        <a href="agendamentos.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
          <span>Histórico</span>
        </a>
        <a href="perfil.html" class="bottom-nav__item bottom-nav__item--active">
          <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <dialog id="profileDialog">
      <h3 class="dialog-title">Editar perfil</h3>
      <form id="profileForm" class="field-stack" style="margin-top: 1rem;">
        <input class="input-field" id="name" placeholder="Nome..." />
        <input
          class="input-field"
          id="phone"
          type="tel"
          placeholder="(14) 98888-8899"
          inputmode="numeric"
        />
        <p class="form-error" id="profileFormError" style="display: none;"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn-primary" id="saveProfileBtn">Salvar alterações</button>
          <button type="button" class="btn-outline" id="cancelProfileBtn">Cancelar</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmLogoutDialog">
      <h3 class="dialog-title">Sair da conta?</h3>
      <p class="dialog-message">
        Você precisará entrar novamente com seu telefone para acessar seus agendamentos.
      </p>
      <div class="dialog-actions">
        <button type="button" class="btn-danger" id="confirmLogoutBtn">Sim, sair</button>
        <button type="button" class="btn-outline" id="cancelLogoutBtn">Cancelar</button>
      </div>
    </dialog>

    <script type="module" src="js/perfil.js"></script>
  </body>
</html>
