<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Agendar — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen" id="screen" style="display: none;">
      <div class="top-bar">
        <a href="pets.html" aria-label="Voltar" class="btn-round">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </a>
        <h1 style="font-size: 1.25rem; font-weight: 700;">Agendar</h1>
      </div>

      <div class="card pet-summary" id="petSummary" style="display: none;">
        <div class="pet-summary__photo" id="petSummaryPhoto"></div>
        <div class="pet-summary__info">
          <p class="pet-summary__name" id="petSummaryName"></p>
          <p class="pet-summary__breed" id="petSummaryBreed"></p>
        </div>
        <a href="pets.html" class="btn-link">Trocar</a>
      </div>

      <p class="section-label">Selecione o serviço</p>
      <div class="service-list" id="serviceList"></div>

      <div class="card package-choice">
        <label class="section-label" for="packageSelect">Como deseja agendar?</label>
        <select id="packageSelect" class="input-field"><option value="">Atendimento avulso</option></select>
        <p id="packageHint" class="text-muted-note">Você pode usar um pacote ativo cadastrado pelo pet shop.</p>
        <a class="btn-link" href="pacotes.html">Consultar meus pacotes</a>
      </div>

      <div class="card">
        <div class="calendar-header">
          <button type="button" class="calendar-nav" id="prevMonth">‹</button>
          <p style="font-family: var(--font-display); font-weight: 700;" id="calendarLabel"></p>
          <button type="button" class="calendar-nav" id="nextMonth">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div class="calendar-days" id="calendarDays"></div>
      </div>

      <div id="slotsSection" style="margin-top: 1.25rem; display: none;">
        <p class="section-label">Selecione um horário</p>
        <p id="slotsLoading" style="font-size: 0.875rem; color: var(--muted); display: none;">Carregando horários...</p>
        <div class="slots-grid" id="slotsGrid"></div>
      </div>

      <p class="form-error" id="errorMsg" style="display: none; margin-top: 0.75rem;"></p>

      <div class="spacer" style="min-height: 1.5rem;"></div>

      <p class="text-center" id="summaryLine" style="display: none; margin-bottom: 0.75rem; font-size: 0.875rem; color: var(--muted);"></p>

      <div class="field-stack">
        <button type="button" class="btn-primary" id="advanceBtn" disabled>Avançar</button>
        <a href="pets.html" class="btn-outline">Voltar</a>
      </div>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <script type="module" src="js/agendar.js"></script>
  </body>
</html>
