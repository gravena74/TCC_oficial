<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Meus agendamentos — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen screen--with-bottom-nav" id="screen" style="display: none;">
      <div class="top-bar">
        <a href="home.html" aria-label="Voltar" class="btn-round">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </a>
        <h1 style="font-size: 1.25rem; font-weight: 700;">Meus agendamentos</h1>
      </div>

      <div class="banner" id="justBookedBanner" style="display: none;">
        Solicitação de agendamento enviada com sucesso!
        <span class="material-symbols-rounded" aria-hidden="true">pets</span>
      </div>

      <p class="text-center" id="loadingMsg" style="margin-top: 2.5rem; font-size: 0.875rem; color: var(--muted);">
        Carregando...
      </p>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state__icon"><span class="material-symbols-rounded" aria-hidden="true">event_busy</span></div>
        <p class="empty-state__title">Nenhum agendamento ainda.</p>
        <a href="pets.html" class="btn-link" style="display: inline-block; margin-top: 1rem;">Agendar agora</a>
      </div>

      <p id="appointmentError" class="form-error" role="alert" hidden></p>
      <div class="appointment-list" id="appointmentList"></div>

      <nav class="bottom-nav">
        <a href="home.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">home</span>
          <span>Início</span>
        </a>
        <a href="pets.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">calendar_add_on</span>
          <span>Agendar</span>
        </a>
        <a href="pets.html?mode=manage" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
          <span>Pets</span>
        </a>
        <a href="agendamentos.html" class="bottom-nav__item bottom-nav__item--active">
          <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
          <span>Histórico</span>
        </a>
        <a href="perfil.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <script type="module" src="js/agendamentos.js"></script>
  </body>
</html>
