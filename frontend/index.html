<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <meta name="description" content="Cafofo do Pet — agende banho, tosa e veterinario para o seu pet." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Cafofo do Pet</title>
  </head>
  <body>
    <div class="photo-shell">
      <img
        class="photo-shell__img"
        src="assets/Screenshot%202026-10-17%20000002.png"
        alt="Golden retriever sorrindo, deitado na grama"
      />

      <div class="photo-shell__body">
        <div class="photo-shell__badge">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
        </div>

        <div class="photo-shell__heading">
          <h1><span>Cafofo</span> <span class="accent">do Pet</span></h1>
          <p class="photo-shell__tagline">Cuidado e carinho para seu pet.</p>
        </div>

        <div class="photo-shell__content">
          <h2 style="font-size: 26px; font-weight: 800; line-height: 1.25;">
            Agende o melhor para seu pet!
          </h2>
          <p style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted);">
            Agendamento fácil para seu melhor amigo.
          </p>

          <ul class="perks">
            <li><span class="perk-icon"><span class="material-symbols-rounded" aria-hidden="true">calendar_month</span></span> Agendamento rápido</li>
            <li><span class="perk-icon"><span class="material-symbols-rounded" aria-hidden="true">location_on</span></span> Acompanhe o status</li>
            <li><span class="perk-icon"><span class="material-symbols-rounded" aria-hidden="true">history</span></span> Histórico dos agendamentos</li>
          </ul>

          <div class="spacer"></div>

          <div class="field-stack">
            <a class="btn-primary" id="agendarLink" href="login.html?returnTo=home.html">
              <span class="material-symbols-rounded" aria-hidden="true">pets</span> Agendar
            </a>
            <a class="btn-outline" id="acompanharLink" href="login.html?returnTo=home.html">
              Acompanhar agendamento
            </a>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/welcome.js"></script>
  </body>
</html>
