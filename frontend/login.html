<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Entrar — Cafofo do Pet</title>
  </head>
  <body>
    <div class="photo-shell">
      <img
        class="photo-shell__img"
        src="assets/Screenshot%202026-10-17%20000002.png"
        alt="Cachorro pug fofo olhando para a câmera"
      />

      <div class="photo-shell__body">
        <div class="photo-shell__badge">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
        </div>

        <div class="photo-shell__heading">
          <h1><span>Cafofo</span> <span class="accent">do Pet</span></h1>
          <p class="photo-shell__tagline">Cuidado e carinho para seu pet.</p>
        </div>

        <div class="photo-shell__content">
          <p id="returnHint" class="text-center" style="display: none; margin-bottom: 1rem; font-size: 0.75rem; font-weight: 600; color: var(--brand-700);">
            Faça login para ver seus agendamentos com segurança.
          </p>

          <form id="loginForm" style="display: flex; flex: 1; flex-direction: column;">
            <div class="field-stack">
              <input class="input-field" id="name" name="name" placeholder="Nome..." autocomplete="name" />
              <input
                class="input-field"
                id="phone"
                name="phone"
                type="tel"
                placeholder="(14) 98888-8899"
                inputmode="numeric"
                autocomplete="tel"
              />
              <p class="form-error" id="formError" style="display: none;"></p>
            </div>

            <div class="spacer"></div>

            <div class="field-stack">
              <button type="submit" class="btn-primary" id="submitBtn">Avançar</button>
              <a class="btn-outline" href="index.html">Voltar</a>
            </div>

            <p class="hint">Utilizaremos essas informações apenas para contato.</p>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
